<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Local and global attack-event cost aggregation</title>
  <desc id="desc">Every attack event has a local cost and a global cost. Attack event C aggregates the global costs of alternative predecessor events A and B, then adds its own local cost. Terminal attack event E aggregates the global costs of required predecessor events C and D, then adds its own local cost.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 17px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 15px system-ui, sans-serif; fill: #334155; }
      .small { font: 13px system-ui, sans-serif; fill: #475569; }
      .mono { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .node { stroke: #334155; stroke-width: 2; rx: 10; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 700 14px system-ui, sans-serif; fill: #1d4ed8; }
      .grid { stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="40" y="40" class="title">Every attack event has a local and a global cost</text>
  <text x="40" y="67" class="body">The model labels these Local Difficulty (LD) and Global Difficulty (GD). Aggregation passes GD downstream.</text>

  <rect x="45" y="100" width="235" height="105" class="node" fill="#dbeafe"/>
  <text x="162" y="130" text-anchor="middle" class="heading">Attack event A</text>
  <text x="65" y="160" class="body">Local cost: LD_A</text>
  <text x="65" y="187" class="body">Global cost: GD_A = LD_A</text>

  <rect x="45" y="245" width="235" height="105" class="node" fill="#dbeafe"/>
  <text x="162" y="275" text-anchor="middle" class="heading">Attack event B</text>
  <text x="65" y="305" class="body">Local cost: LD_B</text>
  <text x="65" y="332" class="body">Global cost: GD_B = LD_B</text>

  <rect x="385" y="157" width="310" height="135" class="node" fill="#fef3c7"/>
  <text x="540" y="187" text-anchor="middle" class="heading">Attack event C (OR)</text>
  <text x="410" y="219" class="body">Local cost: LD_C</text>
  <text x="410" y="248" class="body">Global cost:</text>
  <text x="540" y="276" text-anchor="middle" class="mono">GD_C = min(GD_A, GD_B) + LD_C</text>

  <rect x="385" y="325" width="310" height="100" class="node" fill="#dbeafe"/>
  <text x="540" y="355" text-anchor="middle" class="heading">Attack event D</text>
  <text x="410" y="385" class="body">Local cost: LD_D</text>
  <text x="410" y="412" class="body">Global cost: GD_D = LD_D</text>

  <rect x="795" y="215" width="355" height="145" class="node" fill="#dcfce7"/>
  <text x="972" y="247" text-anchor="middle" class="heading">Terminal attack event E (AND)</text>
  <text x="825" y="280" class="body">Local cost: LD_E</text>
  <text x="825" y="309" class="body">Global cost:</text>
  <text x="972" y="339" text-anchor="middle" class="mono">GD_E = GD_C + GD_D + LD_E</text>

  <path d="M280 152 C330 152 335 190 385 202" class="edge"/>
  <text x="320" y="153" class="edge-label">GD_A</text>
  <path d="M280 297 C330 297 335 260 385 247" class="edge"/>
  <text x="320" y="292" class="edge-label">GD_B</text>
  <path d="M695 225 C745 225 748 260 795 273" class="edge"/>
  <text x="725" y="225" class="edge-label">GD_C</text>
  <path d="M695 375 C745 375 748 326 795 307" class="edge"/>
  <text x="725" y="365" class="edge-label">GD_D</text>

  <rect x="45" y="445" width="1105" height="35" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="597" y="468" text-anchor="middle" class="body">A downstream event aggregates each predecessor's global cost (GD), and then adds its own local cost (LD).</text>

  <rect x="45" y="500" width="1105" height="125" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <line x1="45" y1="535" x2="1150" y2="535" class="grid"/>
  <line x1="45" y1="565" x2="1150" y2="565" class="grid"/>
  <line x1="45" y1="595" x2="1150" y2="595" class="grid"/>
  <line x1="135" y1="500" x2="135" y2="625" class="grid"/>
  <line x1="235" y1="500" x2="235" y2="625" class="grid"/>
  <line x1="335" y1="500" x2="335" y2="625" class="grid"/>
  <line x1="435" y1="500" x2="435" y2="625" class="grid"/>
  <line x1="665" y1="500" x2="665" y2="625" class="grid"/>
  <line x1="765" y1="500" x2="765" y2="625" class="grid"/>
  <line x1="865" y1="500" x2="865" y2="625" class="grid"/>

  <text x="90" y="523" text-anchor="middle" class="heading">s</text>
  <text x="185" y="523" text-anchor="middle" class="heading">GD_A</text>
  <text x="285" y="523" text-anchor="middle" class="heading">GD_B</text>
  <text x="385" y="523" text-anchor="middle" class="heading">LD_C</text>
  <text x="550" y="523" text-anchor="middle" class="small">GD_C = min(GD_A, GD_B) + LD_C</text>
  <text x="715" y="523" text-anchor="middle" class="heading">GD_D</text>
  <text x="815" y="523" text-anchor="middle" class="heading">LD_E</text>
  <text x="1007" y="523" text-anchor="middle" class="small">GD_E = GD_C + GD_D + LD_E</text>

  <text x="90" y="557" text-anchor="middle" class="mono">1</text><text x="185" y="557" text-anchor="middle" class="mono">4</text><text x="285" y="557" text-anchor="middle" class="mono">9</text><text x="385" y="557" text-anchor="middle" class="mono">3</text><text x="550" y="557" text-anchor="middle" class="mono">7</text><text x="715" y="557" text-anchor="middle" class="mono">2</text><text x="815" y="557" text-anchor="middle" class="mono">1</text><text x="1007" y="557" text-anchor="middle" class="mono">10</text>
  <text x="90" y="587" text-anchor="middle" class="mono">2</text><text x="185" y="587" text-anchor="middle" class="mono">10</text><text x="285" y="587" text-anchor="middle" class="mono">5</text><text x="385" y="587" text-anchor="middle" class="mono">4</text><text x="550" y="587" text-anchor="middle" class="mono">9</text><text x="715" y="587" text-anchor="middle" class="mono">3</text><text x="815" y="587" text-anchor="middle" class="mono">1</text><text x="1007" y="587" text-anchor="middle" class="mono">13</text>
  <text x="90" y="617" text-anchor="middle" class="mono">3</text><text x="185" y="617" text-anchor="middle" class="mono">6</text><text x="285" y="617" text-anchor="middle" class="mono">8</text><text x="385" y="617" text-anchor="middle" class="mono">2</text><text x="550" y="617" text-anchor="middle" class="mono">8</text><text x="715" y="617" text-anchor="middle" class="mono">4</text><text x="815" y="617" text-anchor="middle" class="mono">1</text><text x="1007" y="617" text-anchor="middle" class="mono">13</text>
</svg>
